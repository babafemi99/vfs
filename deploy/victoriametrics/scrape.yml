global:
  scrape_interval: 10s

scrape_configs:
  - job_name: tradeapp-api
    static_configs:
      - targets: ["api:8091"]

  # The observability stack watches itself too.
  - job_name: victorialogs
    static_configs:
      - targets: ["victorialogs:9428"]
  - job_name: vmalert
    static_configs:
      - targets: ["vmalert:8880"]
