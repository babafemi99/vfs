# One JSON line per request (shipped to VictoriaLogs by Vector). request_id
# is the same id the trade app logs: the browser's X-Request-Id if it sent
# one, otherwise one nginx generates and passes on.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format json escape=json '{"time":"$time_iso8601","level":"INFO","msg":"http",'
    '"service":"web","method":"$request_method","path":"$uri","status":$status,'
    '"dur":$request_time,"upstream_dur":"$upstream_response_time","bytes":$body_bytes_sent,'
    '"request_id":"$req_id","remote":"$remote_addr"}';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout json;

    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The single-page app (hash routes: everything is index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The trade app. SSE streams (/api/stream, /api/admin/webhooks/stream)
    # need buffering off and a long read timeout.
    location /api/ {
        proxy_pass http://api:8091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # brokersim's dev API for the provider console (/sim/dev/... → /dev/...).
    location /sim/ {
        proxy_pass http://brokersim:8090/;
        proxy_http_version 1.1;
        proxy_set_header X-Request-Id $req_id;
    }
}
